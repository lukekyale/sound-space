<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Space</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="homepage">

  <!-- HEADER -->
  <div class="header">
    <div class="marquee">
      <span class="sound">((( SOUND )))</span>
    </div>

    <span class="space">SPACE</span>
  </div>

<!-- SPEAKERS START HERE -->
<div class="speaker-grid">

  <a class="speaker-link dieter" href="dieter-rams.html">
    <img src="webzineimages/speakerhead-icon.svg" alt="">
    <span>DIETER RAMS</span>
  </a>

  <a class="speaker-link tom" href="tom-sachs.html">
    <img src="webzineimages/speakerhead-icon.svg" alt="">
    <span>TOM SACHS</span>
  </a>

  <a class="speaker-link author" href="author-statement.html">
    <img src="webzineimages/speakerhead-icon.svg" alt="">
    <span>AUTHOR STATEMENT</span>
  </a>

  <a class="speaker-link syng" href="syng.html">
    <img src="webzineimages/speakerhead-icon.svg" alt="">
    <span>SYNG</span>
  </a>

  <a class="speaker-link ojas" href="ojas.html">
    <img src="webzineimages/speakerhead-icon.svg" alt="">
    <span>OJAS</span>
  </a>

</div>


<audio
  id="speaker-sound"
  src="webzineimages/bass-drop.m4a"
  preload="auto">
</audio>

<script>
  const sound = document.getElementById("speaker-sound");
  const speakers = document.querySelectorAll(".speaker-link");
  let openingPage = false;

  speakers.forEach(function (speaker) {
    speaker.addEventListener("click", function (event) {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();

      if (openingPage) return;
      openingPage = true;

      function openPage() {
        window.location.href = speaker.href;
      }

      sound.onended = openPage;

      sound.play().catch(function () {
        openingPage = false;
        alert("The sound could not play. Check that bass-drop.m4a is inside webzineimages.");
      });
    });
  });
</script>

</body>
</html>
